<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Timetabler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#161a22; --muted:#6b7280; --line:#e4e7ec;
    --primary:#3f4ea3; --primary-soft:#e8ebf7; --rotate:#b45309; --rotate-soft:#fdf1e3;
    --ok:#0f8a5f; --ok-soft:#e4f4ee; --block:#eceef1; --block-ink:#aab0ba;
    --danger:#b4232a; --danger-soft:#f8e6e7; --focus:#3f4ea3;
    --r:8px; --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 30px rgba(20,25,35,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
  button:hover{border-color:#c9cdd6}
  button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{background:#354288}
  button.primary:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;border-color:transparent}
  button.danger{color:var(--danger);border-color:var(--danger-soft)}
  button.danger:hover{border-color:#d99ea1}
  input,select,textarea{font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit;width:100%}
  textarea{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:90px;resize:vertical}
  label{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center}
  .col{display:flex;flex-direction:column;gap:8px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--block);color:var(--muted)}
  code{font:12px ui-monospace,Menlo,monospace;background:#f0f1f4;padding:1px 4px;border-radius:4px}

  /* gate (login / connect) */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:20px}
  .gatecard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px}
  .gatecard .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .gatecard .brand b{font-size:20px;font-weight:650;letter-spacing:-.02em}
  .gatecard .sub{color:var(--muted);margin-bottom:20px;font-size:13px}
  .gatecard .fld{margin-bottom:12px}
  .gatecard .fld label{display:block;margin-bottom:4px}
  .gatecard .err{color:var(--danger);font-size:12px;margin-top:4px;min-height:16px}
  .gatecard .actions{display:flex;gap:8px;margin-top:6px}
  .gatecard .actions button{flex:1}
  .gatecard .foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  .gatecard .foot a{color:var(--primary);cursor:pointer;text-decoration:underline}

  header.app{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header.app .brand{display:flex;align-items:baseline;gap:10px}
  header.app .brand b{font-size:16px;font-weight:650;letter-spacing:-.02em}
  header.app .tools{display:flex;gap:8px;align-items:center}
  .syncpill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--block);color:var(--muted)}
  .syncpill.saving{background:var(--rotate-soft);color:var(--rotate)}
  .syncpill.synced{background:var(--ok-soft);color:var(--ok)}
  .syncpill.error{background:var(--danger-soft);color:var(--danger)}

  main{display:none;grid-template-columns:minmax(340px,400px) 1fr;height:calc(100vh - 53px)}
  .left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .right{display:flex;flex-direction:column;min-height:0;background:var(--bg)}

  .segbar{display:flex;padding:10px 12px 0;gap:4px}
  .segbar button{border:none;background:transparent;padding:7px 10px;border-radius:6px;color:var(--muted);font-weight:550}
  .segbar button.active{background:var(--primary-soft);color:var(--primary)}
  .panelbody{padding:12px;overflow:auto;flex:1;min-height:0}

  .card{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:#fff}
  .card > h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;font-weight:650}

  .studenthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .studenthead .ct{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
  .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
  .ygroup{margin-bottom:8px}
  .ygroup .gl{font-size:11px;color:var(--muted);margin:8px 0 6px;font-weight:600}
  .stud{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:#fff;cursor:grab}
  .stud:hover{border-color:#c2c8d4;background:#fcfcfd}
  .stud.placed{opacity:.55}
  .stud .grip{color:#c2c8d4;font-size:13px;line-height:1;letter-spacing:-2px}
  .stud .dot{width:9px;height:9px;border-radius:2px;flex:none}
  .stud .meta{flex:1;min-width:0}
  .stud .meta .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stud .meta .sub{font-size:12px;color:var(--muted)}
  .stud .edit{color:var(--muted);font-size:12px;opacity:0}
  .stud:hover .edit{opacity:1}

  .prow{display:grid;grid-template-columns:1fr 84px 84px 28px;gap:6px;margin-bottom:6px;align-items:center}
  .prow input{width:100%}

  .gridwrap{overflow:auto;flex:1;min-height:0;padding:12px}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  table.grid th:last-child,table.grid td:last-child{border-right:none}
  table.grid thead th{background:#fafbfc;padding:9px 10px;font-size:12px;font-weight:600;text-align:center;position:sticky;top:0;z-index:2}
  table.grid th.rowhead{text-align:left;background:#fafbfc;position:sticky;left:0;z-index:1;min-width:120px}
  table.grid td.rowhead{text-align:left;background:#fafbfc;padding:8px 10px;position:sticky;left:0;z-index:1;min-width:120px}
  table.grid td.rowhead .pn{font-weight:600}
  table.grid td.rowhead .pt{font-size:11px;color:var(--muted)}
  .cell{position:relative;min-height:56px;height:56px;vertical-align:top;padding:4px;transition:background .08s}
  .cell.break{background:repeating-linear-gradient(45deg,#fafbfc,#fafbfc 8px,#f3f4f6 8px,#f3f4f6 16px)}
  .cell.blocked{background:var(--block);color:var(--block-ink)}
  .cell.drop-ok{outline:2px dashed var(--ok);outline-offset:-4px;background:var(--ok-soft)}
  .cell.drop-no{background:var(--block);cursor:not-allowed}
  .cell.rx-year{background:#fbeaea}.cell.rx-year .tag{color:#9a2b2b}
  .cell.rx-inherit{background:#f4eeee;color:#b98a8a}
  .cell.rx-student{background:#fde9d6}.cell.rx-student .tag{color:#9a5312}
  .cell.editable{cursor:pointer}
  .cell.editable:hover{box-shadow:inset 0 0 0 2px var(--primary-soft)}
  .cell .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .lesson{border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.25;background:var(--primary-soft);border:1px solid #cdd4ee;height:100%;display:flex;flex-direction:column;gap:2px;cursor:pointer}
  .lesson.rotating{background:var(--rotate-soft);border-color:#f0d3ac}
  .lesson .who{font-weight:600;display:flex;align-items:center;gap:4px}
  .lesson .rot{font-size:11px;color:var(--rotate);font-weight:600}
  .lesson .turn{display:flex;flex-direction:column;gap:1px;margin-top:1px}
  .lesson .turn .t{font-size:11px;color:var(--muted)}
  .lesson .turn .t.now{color:var(--rotate);font-weight:600}
  .lesson .turn .t .idx{font-variant-numeric:tabular-nums}

  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .toolbar .grow{flex:1}
  .toolbar .tip{font-size:12px;color:var(--muted)}
  .conflict{color:var(--danger);font-weight:600;font-size:12px}
  .empty{color:var(--muted);padding:24px;text-align:center;font-size:13px}

  dialog{border:1px solid var(--line);border-radius:12px;padding:0;box-shadow:var(--shadow);max-width:440px;width:92%}
  dialog::backdrop{background:rgba(20,25,35,.4)}
  .dlgbody{padding:18px}
  dialog h3{margin-bottom:12px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .fldrow{display:flex;gap:8px}
  .fld2{flex:1;display:flex;flex-direction:column;gap:4px}
  .modes{display:flex;gap:4px;margin-bottom:14px;background:#f0f1f4;padding:3px;border-radius:8px}
  .modes button{flex:1;border:none;background:transparent;border-radius:6px;padding:6px;color:var(--muted);font-weight:550}
  .modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- GATE: shown until connected + logged in -->
<div id="gate"><div class="gatecard" id="gateCard"><div class="muted">Loading…</div></div></div>

<header class="app" id="appHeader">
  <div class="brand"><b>Lesson Timetabler</b><span class="syncpill" id="syncPill">—</span></div>
  <div class="tools">
    <span class="muted" id="whoami" style="font-size:12px"></span>
    <button id="btnLogout" class="ghost">Log out</button>
  </div>
</header>

<main id="appMain">
  <section class="left">
    <div class="segbar" id="segbar">
      <button data-seg="students" class="active">Students</button>
      <button data-seg="timetable">Timetable</button>
      <button data-seg="restrictions">Restrictions</button>
      <button data-seg="account">Account</button>
    </div>
    <div class="panelbody" id="setupBody"></div>
  </section>
  <section class="right">
    <div class="toolbar">
      <div class="row"><label for="weekSel">Week</label><select id="weekSel" style="width:auto"></select></div>
      <span class="tip">Drag a student on. Drop onto a filled slot to make it rotating.</span>
      <div class="grow"></div>
      <span id="conflictMsg" class="conflict"></span>
      <button id="btnClearPlace" class="ghost">Clear all placements</button>
    </div>
    <div class="gridwrap" id="schedWrap"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== connection config ===== */
/* Fill these two to skip the one-time connect screen (both safe to expose): */
const BAKED = { url:"", key:"" };
const CFG_KEY = "lt_conn_cfg";
function connCfg(){
  if(BAKED.url && BAKED.key) return {...BAKED, baked:true};
  try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return {}}
}
function saveConnCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c))}

/* ===== app state (cloud-only; no local persistence of data) ===== */
const YEAR_COLORS=["#3f4ea3","#0f8a5f","#b45309","#8b2fb0","#0e7490","#a13d63","#556b2f","#9a3412"];
function pid(){return "p"+Math.random().toString(36).slice(2,8)}
function sid(){return "s"+Math.random().toString(36).slice(2,8)}
function cellKey(day,periodId){return day+"|"+periodId}
function parseCell(k){const [day,periodId]=k.split("|");return {day,periodId}}
function blankState(){
  return {
    termWeeks:10,
    days:["Mon","Tue","Wed","Thu","Fri"],
    periods:[
      {id:pid(),name:"P1",start:"09:00",end:"09:45",brk:false},
      {id:pid(),name:"P2",start:"09:45",end:"10:30",brk:false},
      {id:pid(),name:"Recess",start:"10:30",end:"10:50",brk:true},
      {id:pid(),name:"P3",start:"10:50",end:"11:35",brk:false},
      {id:pid(),name:"P4",start:"11:35",end:"12:20",brk:false},
      {id:pid(),name:"Lunch",start:"12:20",end:"13:00",brk:true},
      {id:pid(),name:"P5",start:"13:00",end:"13:45",brk:false},
      {id:pid(),name:"P6",start:"13:45",end:"14:30",brk:false}
    ],
    students:[], yearRestrictions:{}, studentRestrictions:{}, placements:[]
  };
}
function migrate(d){
  const b=blankState();
  return {
    termWeeks:d.termWeeks||b.termWeeks,
    days:(d.days&&d.days.length)?d.days:b.days,
    periods:(d.periods&&d.periods.length)?d.periods:b.periods,
    students:d.students||[],
    yearRestrictions:d.yearRestrictions||{},
    studentRestrictions:d.studentRestrictions||{},
    placements:d.placements||[]
  };
}
let S=blankState();

/* ===== supabase ===== */
let sb=null, sbUser=null, lastSynced=null, pushTimer=null, applyingRemote=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function isMissingTable(e){const s=((e&&e.message)||"")+((e&&e.code)||"");return /app_state/.test(s)&&/exist|not.*find|relation|schema/i.test(s)||/PGRST205|42P01/.test(s)}

function setSync(state,e){
  const p=document.getElementById("syncPill");if(!p)return;
  p.className="syncpill "+(state==="saving"?"saving":state==="synced"?"synced":state==="error"?"error":"");
  if(state==="saving")p.textContent="saving…";
  else if(state==="synced")p.textContent="synced "+(lastSynced?lastSynced.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"");
  else if(state==="error")p.textContent="save error";
  else if(state==="offline")p.textContent="offline";
  else p.textContent="—";
}

/* local-first save: cache on device instantly (never lost) + debounced cloud push */
const LOCAL_PREFIX="lt_state_";
function localKey(){return sbUser?LOCAL_PREFIX+sbUser.id:null}
function writeLocal(ts){const k=localKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify({data:S,updatedAt:ts||new Date().toISOString()}))}catch(e){}}
function readLocal(){const k=localKey();if(!k)return null;try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function save(push=true){ if(applyingRemote)return; writeLocal(); if(push)scheduleCloudPush() }
function scheduleCloudPush(){
  if(!sb||!sbUser)return;
  if(!navigator.onLine){setSync("offline");return}
  setSync("saving");
  clearTimeout(pushTimer);
  pushTimer=setTimeout(cloudPush,600);
}
async function cloudPush(){
  if(!sb||!sbUser)return;
  try{
    const {error}=await sb.from("app_state").upsert(
      {user_id:sbUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:"user_id"});
    if(error){ if(isMissingTable(error))showTableError(); else setSync("error",error); return }
    lastSynced=new Date(); setSync("synced");
  }catch(e){ setSync("error",e) }
}
async function loadAndReconcile(){
  applyingRemote=true;
  try{
    const local=readLocal();
    let cloud=null, cloudErr=null;
    try{
      const {data,error}=await sb.from("app_state").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();
      if(error){ if(isMissingTable(error)){showTableError();return false} cloudErr=error; }
      else if(data){ cloud={data:data.data,updatedAt:data.updated_at}; }
    }catch(e){ cloudErr=e; }

    const lHas=local&&local.data&&Object.keys(local.data).length;
    const cHas=cloud&&cloud.data&&Object.keys(cloud.data).length;

    if(cloudErr){
      if(lHas){ S=migrate(local.data); setSync(navigator.onLine?"error":"offline"); toast("Using this device's copy — will sync when back online."); return true; }
      return false;   // no local fallback → don't risk overwriting cloud; show retry
    }
    if(!cHas&&!lHas){ S=blankState(); await cloudPush(); writeLocal(); return true; }
    if(cHas&&!lHas){ S=migrate(cloud.data); writeLocal(cloud.updatedAt); lastSynced=new Date(); setSync("synced"); return true; }
    if(!cHas&&lHas){ S=migrate(local.data); await cloudPush(); return true; }
    const cT=Date.parse(cloud.updatedAt)||0, lT=Date.parse(local.updatedAt)||0;
    if(cT>=lT){ S=migrate(cloud.data); writeLocal(cloud.updatedAt); lastSynced=new Date(); setSync("synced"); }
    else { S=migrate(local.data); await cloudPush(); toast("Synced this device's newer changes."); }
    return true;
  }catch(e){ setSync("error"); return false; }
  finally{ applyingRemote=false; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){clearTimeout(pushTimer);cloudPush()} });
window.addEventListener("beforeunload",()=>{ if(sb&&sbUser){clearTimeout(pushTimer);cloudPush()} });
window.addEventListener("online",()=>{ if(sb&&sbUser){scheduleCloudPush()} });
window.addEventListener("offline",()=>setSync("offline"));

/* ===== gate / auth flow ===== */
function boot(){
  const cfg=connCfg();
  if(!cfg.url||!cfg.key){ showConnectScreen(); return; }
  if(!window.supabase){ gateMessage("Couldn't load the sync library — check your internet connection and reload."); return; }
  sb=window.supabase.createClient(cfg.url,cfg.key);
  sb.auth.onAuthStateChange((_e,session)=>{
    const was=sbUser; sbUser=session?session.user:null;
    if(sbUser && !was){ enterApp(); }
    else if(!sbUser && was){ location.reload(); }   // clean slate on logout
  });
  sb.auth.getSession().then(({data})=>{
    if(data&&data.session){ sbUser=data.session.user; enterApp(); }
    else { showLoginScreen(); }
  });
}
async function enterApp(){
  document.getElementById("whoami").textContent=sbUser.email||"";
  const ok=await loadFromCloudReconcile();
  if(ok===false){
    if(document.getElementById("gate").dataset.mode==="table") return;
    showRetry(); return;
  }
  document.getElementById("gate").style.display="none";
  document.getElementById("appHeader").style.display="flex";
  document.getElementById("appMain").style.display="grid";
  renderAll();
}
const loadFromCloudReconcile=loadAndReconcile;
function showRetry(){
  const g=document.getElementById("gate");g.style.display="flex";g.dataset.mode="retry";
  document.getElementById("appHeader").style.display="none";document.getElementById("appMain").style.display="none";
  g.querySelector(".gatecard").innerHTML=`
    <div class="brand"><b>Lesson Timetabler</b></div>
    <div class="sub">Couldn't reach the cloud, and there's no copy saved on this device yet. Check your connection and try again — nothing has been changed.</div>
    <div class="actions"><button id="rt_go" class="primary">Try again</button></div>`;
  g.querySelector("#rt_go").onclick=()=>{g.dataset.mode="";enterApp()};
}

function gateMessage(msg){
  document.getElementById("gate").style.display="flex";
  document.getElementById("gateCard").innerHTML=`<div class="brand"><b>Lesson Timetabler</b></div><div class="sub">${esc(msg)}</div>`;
}
function showLoginScreen(err){
  const g=document.getElementById("gate");g.style.display="flex";g.dataset.mode="login";
  document.getElementById("appHeader").style.display="none";document.getElementById("appMain").style.display="none";
  g.querySelector(".gatecard").innerHTML=`
    <div class="brand"><b>Lesson Timetabler</b></div>
    <div class="sub">Sign in to your schedule.</div>
    <div class="fld"><label>Email</label><input id="lg_email" type="email" autocomplete="username"></div>
    <div class="fld"><label>Password</label><input id="lg_pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="lg_err">${err?esc(err):""}</div>
    <div class="actions"><button id="lg_in" class="primary">Log in</button><button id="lg_up">Create account</button></div>
    <div class="foot">Your data is private to this account.</div>`;
  const em=g.querySelector("#lg_email"), pw=g.querySelector("#lg_pw"), er=g.querySelector("#lg_err");
  const attempt=async(mode)=>{
    er.textContent="";
    const e=em.value.trim(), p=pw.value;
    if(!e||!p){er.textContent="Enter email and password.";return}
    if(mode==="up"){
      const {error}=await sb.auth.signUp({email:e,password:p});
      if(error){er.textContent=error.message;return}
      er.style.color="var(--ok)";er.textContent="Account created. If email confirmation is on, confirm then log in.";
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
      if(error){er.textContent=error.message;return}
      /* onAuthStateChange handles entering the app */
    }
  };
  g.querySelector("#lg_in").onclick=()=>attempt("in");
  g.querySelector("#lg_up").onclick=()=>attempt("up");
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")attempt("in")});
  em.focus();
}
function showConnectScreen(){
  const g=document.getElementById("gate");g.style.display="flex";g.dataset.mode="connect";
  g.querySelector(".gatecard").innerHTML=`
    <div class="brand"><b>Lesson Timetabler</b></div>
    <div class="sub">One-time setup: connect this app to your Supabase project. In Supabase → Settings → API Keys, copy the Project URL and the publishable key.</div>
    <div class="fld"><label>Project URL</label><input id="cn_url" placeholder="https://xxxx.supabase.co"></div>
    <div class="fld"><label>Publishable key</label><input id="cn_key" placeholder="sb_publishable_…"></div>

      if(!years.length)valSel.innerHTML=`<option value="">— add students first —</option>`;

    }else{
      if(!S.students.length)valSel.innerHTML=`<option value="">— add students first —</option>`;
      S.students.forEach(s=>valSel.append(new Option(s.name+" (Yr "+(s.year||"—")+")",s.id)));
      rxScope={type:"student",value:S.students[0]?S.students[0].id:null};
    }
    if(valSel.value)rxScope.value=valSel.value;
  }
  fillVal();valSel.value=rxScope.value||"";

  valSel.onchange=()=>{rxScope.value=valSel.value;renderRxGrid(host)};

  const legend=document.createElement("div");legend.style.marginTop="10px";legend.className="row";legend.style.flexWrap="wrap";
  legend.innerHTML=`<span class="pill" style="background:#fbeaea;color:#9a2b2b">Year block</span><span class="pill" style="background:#f4eeee;color:#b98a8a">Inherited</span><span class="pill" style="background:#fde9d6;color:#9a5312">Student block</span>`;
  c.append(legend);wrap.append(c);
  const gc=document.createElement("div");gc.className="card";gc.innerHTML=`<h3>Click to toggle</h3>`;
  const host=document.createElement("div");host.style.overflow="auto";gc.append(host);wrap.append(gc);
  renderRxGrid(host);

function renderRxGrid(host){
  host.innerHTML="";
  if(!rxScope.value){host.innerHTML=`<div class="muted">Add students to define restrictions.</div>`;return}
  const tbl=gridShell();const tb=tbl.querySelector("tbody");
  const isYear=rxScope.type==="year";
  const yearSet=isYear?new Set(S.yearRestrictions[rxScope.value]||[]):null;
  let inh=null,stu=null;
  if(!isYear){const st=studentById(rxScope.value);inh=new Set(S.yearRestrictions[String(st.year)]||[]);stu=new Set(S.studentRestrictions[rxScope.value]||[])}
  S.periods.forEach(p=>{
    const tr=document.createElement("tr");tr.append(rowHead(p));
    S.days.forEach(day=>{
      const td=document.createElement("td");td.className="cell";const k=cellKey(day,p.id);
      if(p.brk){td.classList.add("break");tr.append(td);return}
      td.classList.add("editable");
      if(isYear){
        if(yearSet.has(k)){td.classList.add("rx-year");td.innerHTML=`<span class="tag">block</span>`}
        td.onclick=()=>{toggle(S.yearRestrictions,rxScope.value,k);save();renderRxGrid(host);renderRight()};
      }else{
        if(inh.has(k)){td.classList.add("rx-inherit");td.innerHTML=`<span class="tag">year</span>`}
        else if(stu.has(k)){td.classList.add("rx-student");td.innerHTML=`<span class="tag">block</span>`}
        td.onclick=()=>{if(inh.has(k)){toast("Set at the year level.");return}toggle(S.studentRestrictions,rxScope.value,k);save();renderRxGrid(host);renderRight()};
      }
      tr.append(td);
    });
    tb.append(tr);
  });
  host.append(tbl);
}
function toggle(store,key,cell){const a=store[key]||(store[key]=[]);const i=a.indexOf(cell);if(i<0)a.push(cell);else a.splice(i,1)}

/* ===== SCHEDULER ===== */
let dragStudentId=null;
function renderRight(){renderSchedule();renderConflicts();if(seg==="students")renderSetup()}
function renderSchedule(){
  const host=document.getElementById("schedWrap");host.innerHTML="";
  if(!S.students.length){host.innerHTML=`<div class="empty">Add students, then drag them onto the grid.</div>`;return}
  const tbl=gridShell();const tb=tbl.querySelector("tbody");
  const week=parseInt(document.getElementById("weekSel").value||"1");
  S.periods.forEach(p=>{
    const tr=document.createElement("tr");tr.append(rowHead(p));
    S.days.forEach(day=>{
      const td=document.createElement("td");td.className="cell";const k=cellKey(day,p.id);td.dataset.k=k;
      if(p.brk){td.classList.add("break");tr.append(td);return}
      const plc=placementAt(k);if(plc)td.append(renderLesson(plc,week));
      td.addEventListener("dragover",e=>{if(!dragStudentId)return;if(blockedCellsFor(dragStudentId).has(k)){e.dataTransfer.dropEffect="none";return}e.preventDefault();e.dataTransfer.dropEffect="move"});
      td.addEventListener("drop",e=>{e.preventDefault();if(!dragStudentId)return;dropStudent(dragStudentId,k)});
      tr.append(td);
    });
    tb.append(tr);
  });
  host.append(tbl);paintDragHints();
}
function renderLesson(plc,week){
  const div=document.createElement("div");const rotating=plc.studentIds.length>1;
  div.className="lesson"+(rotating?" rotating":"");
  const names=plc.studentIds.map(id=>studentById(id)).filter(Boolean);
  if(!rotating){
    const s=names[0];
    div.innerHTML=`<div class="who"><span class="dot" style="width:8px;height:8px;border-radius:2px;background:${yearColor(s.year)}"></span>${esc(s.name)}</div><div class="muted" style="font-size:11px">${esc(s.instrument||"")} · ${s.duration}min</div>`;
  }else{
    const turn=(week-1)%names.length;
    let t=`<div class="turn">`;names.forEach((s,i)=>{t+=`<div class="t ${i===turn?"now":""}"><span class="idx">${i+1}.</span> ${esc(s.name)}${i===turn?" ← this week":""}</div>`});t+=`</div>`;
    div.innerHTML=`<div class="who"><span class="rot">⟳ rotating ×${names.length}</span></div>${t}`;
  }
  div.title="Edit this slot";
  div.onclick=e=>{e.stopPropagation();openLessonDialog(plc)};
  return div;
}
function dropStudent(studentId,k){
  if(blockedCellsFor(studentId).has(k)){toast("Blocked for this student.");return}
  const ex=placementAt(k);
  if(ex){if(ex.studentIds.includes(studentId)){toast("Already here.");return}ex.studentIds.push(studentId);ex.rotating=ex.studentIds.length>1}
  else S.placements.push({id:pid(),cellKey:k,studentIds:[studentId],rotating:false});
  save();renderRight();
}
function paintDragHints(){
  const cells=document.querySelectorAll("#schedWrap .cell");
  cells.forEach(td=>td.classList.remove("drop-ok","drop-no"));
  if(!dragStudentId)return;
  const blocked=blockedCellsFor(dragStudentId);
  cells.forEach(td=>{const k=td.dataset.k;if(!k)return;td.classList.add(blocked.has(k)?"drop-no":"drop-ok")});
}
function openLessonDialog(plc){
  const d=ensureDlg();const {day,periodId}=parseCell(plc.cellKey);const p=S.periods.find(x=>x.id===periodId);
  const names=plc.studentIds.map(id=>studentById(id)).filter(Boolean);
  d.innerHTML=`<div class="dlgbody"><h3>${esc(day)} · ${esc(p?p.name:"")} <span class="muted" style="font-weight:400">${p?p.start+"–"+p.end:""}</span></h3><div class="stack" id="ll"></div><div class="dlgfoot"><button id="ll_del" class="danger">Remove slot</button><span style="flex:1"></span><button id="ll_close" class="primary">Done</button></div></div>`;
  const list=d.querySelector("#ll");
  names.forEach(s=>{
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<span class="dot" style="width:8px;height:8px;border-radius:2px;background:${yearColor(s.year)}"></span><span style="flex:1">${esc(s.name)} <span class="muted">(${esc(s.instrument||"—")})</span></span>`;
    const rm=document.createElement("button");rm.textContent="Remove";rm.className="danger";
    rm.onclick=()=>{plc.studentIds=plc.studentIds.filter(id=>id!==s.id);if(!plc.studentIds.length)S.placements=S.placements.filter(x=>x.id!==plc.id);else plc.rotating=plc.studentIds.length>1;save();d.close();renderRight()};
    r.append(rm);list.append(r);
  });
  d.querySelector("#ll_del").onclick=()=>{S.placements=S.placements.filter(x=>x.id!==plc.id);save();d.close();renderRight()};
  d.querySelector("#ll_close").onclick=()=>d.close();
  d.showModal();
}
function renderConflicts(){
  const seen={};S.placements.forEach(p=>p.studentIds.forEach(id=>{seen[id]=(seen[id]||0)+1}));
  const dbl=Object.entries(seen).filter(([,n])=>n>1).map(([id])=>studentById(id)?.name).filter(Boolean);
  const msg=dbl.length?(dbl.length+" double-booked: "+dbl.join(", ")):"";
  document.getElementById("conflictMsg").textContent=msg;
}
function renderWeekSelect(){
  const sel=document.getElementById("weekSel");const cur=sel.value||"1";sel.innerHTML="";
  for(let i=1;i<=S.termWeeks;i++)sel.append(new Option("Week "+i,i));
  sel.value=Math.min(parseInt(cur),S.termWeeks);
}
document.getElementById("weekSel").addEventListener("change",renderSchedule);
document.getElementById("btnClearPlace").onclick=()=>{if(!S.placements.length)return;if(confirm("Remove all placements?")){S.placements=[];save();renderRight()}};

/* ===== boot ===== */
function renderAll(){renderWeekSelect();renderSetup();renderRight()}
boot();
</script>
</body>
