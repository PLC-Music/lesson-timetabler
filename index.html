<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Timetabler</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#161a22; --muted:#6b7280; --line:#e4e7ec;
    --primary:#3f4ea3; --primary-soft:#e8ebf7; --rotate:#b45309; --rotate-soft:#fdf1e3;
    --ok:#0f8a5f; --ok-soft:#e4f4ee; --block:#eceef1; --block-ink:#aab0ba;
    --danger:#b4232a; --danger-soft:#f8e6e7; --focus:#3f4ea3;
    --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 30px rgba(20,25,35,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  h3{margin:0;font-weight:600}
  button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
  button:hover{border-color:#c9cdd6}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{background:#354288}
  button.ghost{background:transparent;border-color:transparent}
  button.danger{color:var(--danger);border-color:var(--danger-soft)}
  button.danger:hover{border-color:#d99ea1}
  input,select,textarea{font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit;width:100%}
  textarea{font:13px/1.4 ui-monospace,Menlo,monospace;min-height:90px;resize:vertical}
  label{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--block);color:var(--muted)}
  code{font:12px ui-monospace,Menlo,monospace;background:#f0f1f4;padding:1px 4px;border-radius:4px}

  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:20px}
  .gatecard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px}
  .gatecard .brand b{font-size:20px;font-weight:650;letter-spacing:-.02em}
  .gatecard .sub{color:var(--muted);margin:6px 0 20px;font-size:13px}
  .gatecard .fld{margin-bottom:12px}
  .gatecard .fld label{display:block;margin-bottom:4px}
  .gatecard .err{color:var(--danger);font-size:12px;margin-top:4px;min-height:16px}
  .gatecard .actions{display:flex;gap:8px;margin-top:6px}
  .gatecard .actions button{flex:1}
  .gatecard .foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}

  header.app{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header.app .brand{display:flex;align-items:baseline;gap:10px}
  header.app .brand b{font-size:16px;font-weight:650;letter-spacing:-.02em}
  header.app .tools{display:flex;gap:8px;align-items:center}
  .syncpill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--block);color:var(--muted)}
  .syncpill.saving{background:var(--rotate-soft);color:var(--rotate)}
  .syncpill.synced{background:var(--ok-soft);color:var(--ok)}
  .syncpill.error{background:var(--danger-soft);color:var(--danger)}
  #whoami{font-size:12px}

  main{display:none;grid-template-columns:minmax(320px,380px) 1fr;height:calc(100vh - 53px)}
  .left{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .right{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .panelbody{padding:12px;overflow:auto;flex:1;min-height:0}

  .studenthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .studenthead .ct{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
  .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
  .ygroup .gl{font-size:11px;color:var(--muted);margin:10px 0 6px;font-weight:600}
  .glbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;padding:2px 0;text-transform:uppercase;letter-spacing:.06em}
  .glbtn:hover{color:var(--primary)}
  .glbtn .glx{font-size:9px;color:var(--primary);opacity:0;text-transform:none;letter-spacing:0;font-weight:500}
  .glbtn:hover .glx{opacity:1}
  .stud{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:#fff;cursor:grab}
  .stud:hover{border-color:#c2c8d4;background:#fcfcfd}
  .stud.placed{opacity:.55}
  .stud .grip{color:#c2c8d4;font-size:13px;letter-spacing:-2px}
  .stud .dot{width:9px;height:9px;border-radius:2px;flex:none}
  .stud .meta{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stud .meta .nm{font-weight:600}
  .stud .meta .sub{color:var(--muted);font-size:12px;margin-left:7px}

  .lesson.grouped{border-left:4px solid var(--gc,#3f4ea3)}
  .lesson.sel{outline:2px solid var(--primary);outline-offset:-2px;box-shadow:0 0 0 2px var(--primary-soft)}
  .lesson .warn{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;font-weight:700;margin-left:3px}
  .warn{color:var(--danger);font-weight:700}
  .stud.tight{border-left:3px solid var(--danger)}
  .yrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 10px}
  .yrow .yl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ychip{padding:3px 8px;font-size:12px;border-radius:999px}
  .selbar{display:flex;align-items:center;gap:8px}
  .selbar #selCount{font-size:12px;color:var(--muted)}
  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .toolbar .grow{flex:1}
  .toolbar .tip{font-size:12px;color:var(--muted)}
  .conflict{color:var(--danger);font-weight:600;font-size:12px}
  .empty{color:var(--muted);padding:24px;text-align:center;font-size:13px}
  .gridwrap{overflow:auto;flex:1;min-height:0;padding:12px}

  /* calendar shell */
  .cal{border:1px solid var(--line);border-radius:8px;background:#fff;min-width:580px}
  .calhead{display:grid;grid-template-columns:58px repeat(var(--cols),1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fafbfc;z-index:5;pointer-events:none}
  .calh{padding:8px;text-align:center;font-weight:600;font-size:12px;border-left:1px solid var(--line)}
  .calh:first-child{border-left:none}
  .calbody{display:grid;grid-template-columns:58px repeat(var(--cols),1fr);position:relative}
  .calgutter{position:relative}
  .calt{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-6px);white-space:nowrap}
  .calday{position:relative;border-left:1px solid var(--line)}

  /* period reference zones (schedule) */
  .pzone{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
  .pzone.alt{background:#fafbfc}
  .pzone .pzn{position:absolute;top:2px;left:4px;font-size:9px;color:#c3c7d0;text-transform:uppercase;letter-spacing:.04em}

  /* blocked overlay while dragging */
  .blockzone{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(180,35,42,.10),rgba(180,35,42,.10) 6px,rgba(180,35,42,.16) 6px,rgba(180,35,42,.16) 7px);border-top:1px solid rgba(180,35,42,.35);border-bottom:1px solid rgba(180,35,42,.35);pointer-events:none;z-index:2}

  /* drop preview */
  .preview{position:absolute;left:3px;right:3px;border:2px dashed var(--primary);border-radius:6px;background:rgba(63,78,163,.08);pointer-events:none;z-index:6;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 5px}
  .preview.bad{border-color:var(--danger);background:rgba(180,35,42,.08)}
  .preview .pl{font-size:10px;font-weight:600;color:var(--primary)}
  .preview.bad .pl{color:var(--danger)}

  /* lesson blocks */
  .lesson{position:absolute;left:3px;right:3px;border-radius:6px;background:var(--primary-soft);border:1px solid #cdd4ee;padding:2px 6px;cursor:grab;overflow:hidden;z-index:3;display:flex;flex-direction:column;gap:0}
  .lesson.rotating{background:var(--rotate-soft);border-color:#f0d3ac}
  .lesson.mergeTarget{outline:2px solid var(--rotate);outline-offset:-1px}
  .lesson .who{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lesson .sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lesson .rot{font-size:11px;font-weight:600;color:var(--rotate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lesson .dot{width:7px;height:7px;border-radius:2px;flex:none}
  .lesson .time{font-size:9px;color:var(--muted)}

  /* restriction bands (in student dialog) */
  .band{position:absolute;left:3px;right:3px;border-radius:6px;border:1px solid var(--line);background:#fcfcfd;overflow:hidden}
  .band .bn{font-size:10px;color:var(--muted);padding:2px 5px}
  .rslot{cursor:pointer}
  .rslot:hover{box-shadow:inset 0 0 0 2px var(--primary-soft)}
  .rslot.rx-year{background:#fbeaea;border-color:#e6b9b9}.rslot.rx-year .bn{color:#9a2b2b;font-weight:600}
  .rslot.rx-inherit{background:#f4eeee;border-color:#e0d2d2}.rslot.rx-inherit .bn{color:#b98a8a}
  .rslot.rx-student{background:#fde9d6;border-color:#f0cfa8}.rslot.rx-student .bn{color:#9a5312;font-weight:600}
  .rslot.rx-teacher{background:#e9ebef;border-color:#d3d7de}.rslot.rx-teacher .bn{color:#5b6270;font-weight:600}
  .rslot.rx-unavail{background:#eceef1;border-color:#d5d9e0}.rslot.rx-unavail .bn{color:#8a909c}
  .calh.dayhead{cursor:pointer;pointer-events:auto}.calh.dayhead:hover{background:#eef0f7;color:var(--primary)}
  .lesson.gslot{border-left:4px solid var(--gc,#3f4ea3)}
  .toolbar .gs{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .toolbar .gs input{width:52px}.toolbar .gs select{width:auto}
  .unavailzone{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#eceef1,#eceef1 6px,#e2e5ea 6px,#e2e5ea 7px);border-top:1px solid #d5d9e0;border-bottom:1px solid #d5d9e0;pointer-events:none;z-index:1}
  .unavailzone .uz{position:absolute;left:4px;top:2px;font-size:9px;color:#8a909c;text-transform:uppercase;letter-spacing:.03em}
  .rslot.rx-sel{box-shadow:inset 0 0 0 2px var(--primary)}
  .boedit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
  .boedit input{margin-top:4px}
  .boedit label{font-size:12px;color:var(--muted)}

  dialog{border:1px solid var(--line);border-radius:12px;padding:0;box-shadow:var(--shadow);max-width:920px;width:94%}
  dialog::backdrop{background:rgba(20,25,35,.4)}
  .dlgbody{padding:18px}
  dialog h3{margin-bottom:12px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .fldrow{display:flex;gap:8px}
  .fld2{flex:1;display:flex;flex-direction:column;gap:4px}
  .modes{display:flex;gap:4px;margin-bottom:14px;background:#f0f1f4;padding:3px;border-radius:8px}
  .modes button{flex:1;border:none;background:transparent;border-radius:6px;padding:6px;color:var(--muted);font-weight:550}
  .modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .sd{display:flex;gap:18px}
  .sdleft{width:230px;flex:none}
  .sdright{flex:1;min-width:0}
  .rcalwrap{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fbfbfc}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  @media(max-width:760px){.sd{flex-direction:column}.sdleft{width:auto}}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate"><div class="gatecard" id="gateCard"><div class="muted">Loading…</div></div></div>

<header class="app" id="appHeader">
  <div class="brand"><b>Lesson Timetabler</b><span class="syncpill" id="syncPill">—</span></div>
  <div class="tools">
    <span class="muted" id="whoami"></span>
    <button id="btnExport" class="ghost">Export</button>
    <button id="btnLogout" class="ghost">Log out</button>
  </div>
</header>

<main id="appMain">
  <section class="left"><div class="panelbody" id="studentsPanel"></div></section>
  <section class="right">
    <div class="toolbar">
      <button id="btnTeacher">My unavailable times</button>
      <span id="selBar" class="selbar" hidden><span id="selCount"></span><button id="btnCombine" class="primary">Combine into rotation</button><button id="btnUngroup" class="ghost" hidden>Ungroup</button><button id="btnSelClear" class="ghost">Clear</button></span>
      <span class="tip">Drag a name to place a lesson. ⌘/Ctrl-click lessons to select, then combine into a rotation.</span>
      <div class="grow"></div>
      <span id="conflictMsg" class="conflict"></span>
      <button id="btnClearPlace" class="ghost">Clear all</button>
    </div>
    <div class="gridwrap" id="schedWrap"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== connection config ===== */
const BAKED={ url:"https://sbvrndhuapwsblsxfnhp.supabase.co", key:"sb_publishable_0mDumlOdReizKlZc9Hjvyg_yErnePe1" };
const CFG_KEY="lt_conn_cfg";
function connCfg(){ if(BAKED.url&&BAKED.key)return {...BAKED}; try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return {}} }
function saveConnCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c))}

/* ===== periods & state ===== */
const SCHOOL_PERIODS=[
  {id:"b1",name:"Before 1",start:"07:00",end:"07:30"},
  {id:"b2",name:"Before 2",start:"07:30",end:"08:00"},
  {id:"b3",name:"Before 3",start:"08:00",end:"08:30"},
  {id:"pcg",name:"PCG",start:"08:30",end:"08:55"},
  {id:"p1",name:"Period 1",start:"08:55",end:"09:40"},
  {id:"p2",name:"Period 2",start:"09:40",end:"10:25"},
  {id:"rec",name:"Morning Tea",start:"10:25",end:"10:45"},
  {id:"p3",name:"Period 3",start:"10:45",end:"11:30"},
  {id:"p4",name:"Period 4",start:"11:30",end:"12:15"},
  {id:"p5",name:"Period 5",start:"12:15",end:"13:00"},
  {id:"lun",name:"Lunch",start:"13:00",end:"13:40"},
  {id:"p6",name:"Period 6",start:"13:40",end:"14:25"},
  {id:"p7",name:"Period 7",start:"14:25",end:"15:10"}
];
const NEW_PID=new Set(SCHOOL_PERIODS.map(p=>p.id));
function pid(){return "p"+Math.random().toString(36).slice(2,8)}
function sid(){return "s"+Math.random().toString(36).slice(2,8)}
function cellKey(day,periodId){return day+"|"+periodId}
function parseCell(k){const [day,periodId]=k.split("|");return {day,periodId}}
function periodsCopy(){return SCHOOL_PERIODS.map(p=>({...p}))}
function blankState(){return {days:["Mon","Tue","Wed","Thu","Fri"],periods:periodsCopy(),students:[],blockouts:[],placements:[],groups:[]}}
function keepNew(arr){return (arr||[]).filter(k=>NEW_PID.has(parseCell(k).periodId))}
function migrate(d){
  const b=blankState();
  let blockouts;
  if(Array.isArray(d.blockouts)){
    blockouts=d.blockouts.map(bo=>({id:bo.id||pid(),reason:bo.reason||"",years:(bo.years||[]).map(String),students:bo.students||[],teacher:!!bo.teacher,cells:keepNew(bo.cells||[])})).filter(bo=>bo.cells.length);
  }else{
    blockouts=[];
    Object.keys(d.yearRestrictions||{}).forEach(y=>keepNew(d.yearRestrictions[y]).forEach(k=>blockouts.push({id:pid(),reason:"",years:[String(y)],students:[],cells:[k]})));
    Object.keys(d.studentRestrictions||{}).forEach(id=>keepNew(d.studentRestrictions[id]).forEach(k=>blockouts.push({id:pid(),reason:"",years:[],students:[id],cells:[k]})));
  }
  const placements=(d.placements||[]).filter(p=>typeof p.start==="number"&&typeof p.duration==="number"&&p.day).map(p=>({id:p.id||pid(),day:p.day,start:p.start,duration:p.duration,studentId:p.studentId||(Array.isArray(p.studentIds)?p.studentIds[0]:null),groupId:p.groupId||null})).filter(p=>p.studentId);
  return {days:(d.days&&d.days.length)?d.days:b.days,periods:periodsCopy(),students:d.students||[],blockouts,placements,groups:[]};
}
let S=blankState();

/* ===== supabase + sync (local-first) ===== */
let sb=null,sbUser=null,lastSynced=null,pushTimer=null,applyingRemote=false,lastCloudError=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function isMissingTable(e){const s=((e&&e.message)||"")+((e&&e.code)||"");return (/app_state/.test(s)&&/exist|not.*find|relation|schema/i.test(s))||/PGRST205|42P01/.test(s)}
function setSync(state){const p=document.getElementById("syncPill");if(!p)return;p.className="syncpill "+(state==="saving"?"saving":state==="synced"?"synced":state==="error"?"error":"");p.textContent=state==="saving"?"saving…":state==="synced"?("synced "+(lastSynced?lastSynced.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"")):state==="error"?"save error":state==="offline"?"offline":"—"}

const LOCAL_PREFIX="lt_state_";
function localKey(){return sbUser?LOCAL_PREFIX+sbUser.id:null}
function writeLocal(ts){const k=localKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify({data:S,updatedAt:ts||new Date().toISOString()}))}catch(e){}}
function readLocal(){const k=localKey();if(!k)return null;try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function save(push=true){if(applyingRemote)return;writeLocal();if(push)scheduleCloudPush()}
function scheduleCloudPush(){if(!sb||!sbUser)return;if(!navigator.onLine){setSync("offline");return}setSync("saving");clearTimeout(pushTimer);pushTimer=setTimeout(cloudPush,600)}
async function cloudPush(){if(!sb||!sbUser)return;try{const {error}=await sb.from("app_state").upsert({user_id:sbUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){if(isMissingTable(error))showTableError();else setSync("error");return}lastSynced=new Date();setSync("synced")}catch(e){setSync("error")}}
async function loadAndReconcile(){
  applyingRemote=true;
  try{
    const local=readLocal(); let cloud=null,cloudErr=null;
    try{const {data,error}=await sb.from("app_state").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();
      if(error){if(isMissingTable(error)){showTableError();return false}cloudErr=error}else if(data){cloud={data:data.data,updatedAt:data.updated_at}}
    }catch(e){cloudErr=e}
    const lHas=local&&local.data&&Object.keys(local.data).length;
    const cHas=cloud&&cloud.data&&Object.keys(cloud.data).length;
    if(cloudErr){ lastCloudError=cloudErr; if(lHas){S=migrate(local.data);setSync(navigator.onLine?"error":"offline");toast("Using this device's copy — will sync when online.");return true} return false }
    if(!cHas&&!lHas){S=blankState();await cloudPush();writeLocal();return true}
    if(cHas&&!lHas){S=migrate(cloud.data);writeLocal(cloud.updatedAt);lastSynced=new Date();setSync("synced");return true}
    if(!cHas&&lHas){S=migrate(local.data);await cloudPush();return true}
    const cT=Date.parse(cloud.updatedAt)||0,lT=Date.parse(local.updatedAt)||0;
    if(cT>=lT){S=migrate(cloud.data);writeLocal(cloud.updatedAt);lastSynced=new Date();setSync("synced")}
    else{S=migrate(local.data);await cloudPush();toast("Synced this device's newer changes.")}
    return true;
  }catch(e){lastCloudError=e;setSync("error");return false}
  finally{applyingRemote=false}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(pushTimer);cloudPush()}});
window.addEventListener("beforeunload",()=>{if(sb&&sbUser){clearTimeout(pushTimer);cloudPush()}});
window.addEventListener("online",()=>{if(sb&&sbUser)scheduleCloudPush()});
window.addEventListener("offline",()=>setSync("offline"));

/* ===== gate / auth ===== */
function boot(){
  const cfg=connCfg();
  if(!cfg.url||!cfg.key){showConnectScreen();return}
  if(!window.supabase){gateMessage("Couldn't load the sync library — check your internet connection and reload.");return}
  sb=window.supabase.createClient(cfg.url,cfg.key);
  sb.auth.onAuthStateChange((_e,session)=>{const was=sbUser;sbUser=session?session.user:null;if(sbUser&&!was)enterApp();else if(!sbUser&&was)location.reload()});

function tableSQL(){return `create table if not exists public.app_state (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}',
  updated_at timestamptz not null default now()
);
alter table public.app_state enable row level security;
grant select, insert, update on public.app_state to authenticated;
drop policy if exists "select own" on public.app_state;
drop policy if exists "insert own" on public.app_state;
drop policy if exists "update own" on public.app_state;
create policy "select own" on public.app_state for select using (auth.uid() = user_id);
create policy "insert own" on public.app_state for insert with check (auth.uid() = user_id);
create policy "update own" on public.app_state for update using (auth.uid() = user_id) with check (auth.uid() = user_id);`}

function studentById(id){return S.students.find(s=>s.id===id)}
function periodById(id){return S.periods.find(p=>p.id===id)}
function sortYears(a,b){const na=parseFloat(a),nb=parseFloat(b),aa=isNaN(na),bb=isNaN(nb);if(aa&&bb)return String(a).localeCompare(b);if(aa)return 1;if(bb)return -1;return na-nb}
function yearColor(year){const ys=[...new Set(S.students.map(s=>String(s.year)))].sort(sortYears);const i=ys.indexOf(String(year));return ["#3f4ea3","#0f8a5f","#b45309","#8b2fb0","#0e7490","#a13d63","#556b2f","#9a3412"][(i<0?0:i)%8]}
function blockedCellsFor(id){const st=studentById(id);const yr=String(st?st.year:"");const set=new Set();S.blockouts.forEach(b=>{if(b.teacher||(b.students||[]).includes(id)||(b.years||[]).includes(yr))(b.cells||[]).forEach(c=>set.add(c))});return set}
function studentPlacements(id){return S.placements.filter(p=>p.studentId===id)}
function toMin(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function minToStr(m){const h=Math.floor(m/60),mm=m%60;const hh=h>12?h-12:h;const ap=h>=12?"pm":"am";return hh+":"+String(mm).padStart(2,"0")+ap}
function fmt12(t){let [h,m]=t.split(":").map(Number);const hh=h>12?h-12:h;return hh+":"+String(m).padStart(2,"0")}
function dayBounds(){return {ds:Math.min(...S.periods.map(p=>toMin(p.start))),de:Math.max(...S.periods.map(p=>toMin(p.end)))}}

/* ===== calendar shell (shared) ===== */
function calShell(){
  const {ds,de}=dayBounds();const total=(de-ds)*PXPM;
  const cal=document.createElement("div");cal.className="cal";cal.style.setProperty("--cols",S.days.length);
  const head=document.createElement("div");head.className="calhead";
  head.append(Object.assign(document.createElement("div"),{className:"calh"}));
  S.days.forEach(d=>{const c=document.createElement("div");c.className="calh";c.textContent=d;head.append(c)});
  cal.append(head);
  const body=document.createElement("div");body.className="calbody";
  const gut=document.createElement("div");gut.className="calgutter";gut.style.height=total+"px";
  S.periods.forEach(p=>{const l=document.createElement("div");l.className="calt";l.style.top=((toMin(p.start)-ds)*PXPM)+"px";l.textContent=fmt12(p.start);gut.append(l)});
  body.append(gut);
  const dayCols={};
  S.days.forEach(d=>{const col=document.createElement("div");col.className="calday";col.dataset.day=d;col.style.height=total+"px";dayCols[d]=col;body.append(col)});
  cal.append(body);
  return {cal,dayCols,ds};
}
function bandEl(p,ds){const b=document.createElement("div");b.className="band";b.style.top=((toMin(p.start)-ds)*PXPM)+"px";b.style.height=((toMin(p.end)-toMin(p.start))*PXPM)+"px";return b}

/* blockout panel: reasons + multi-year, used by year and student dialogs */
function renderBlockoutPanel(host,ctx){
  let selectedId=null;
  const years=[...new Set(S.students.map(s=>String(s.year)).filter(Boolean))].sort(sortYears);
  const scopeYear=ctx.kind==="year"?String(ctx.year):(ctx.student?String(ctx.student.year||""):"");
  const isTeacher=ctx.kind==="teacher";
  function applies(b){ if(isTeacher)return !!b.teacher; return ctx.kind==="year" ? (b.years||[]).includes(scopeYear) : ((b.students||[]).includes(ctx.student.id)||(b.years||[]).includes(scopeYear)); }
  function inherited(b){ return ctx.kind==="student" && !(b.students||[]).includes(ctx.student.id) && (b.years||[]).includes(scopeYear); }
  function teacherAt(k){ return isTeacher?null:S.blockouts.find(b=>b.teacher&&(b.cells||[]).includes(k)); }
  function boAt(k){ return S.blockouts.find(b=>applies(b)&&(b.cells||[]).includes(k)); }
  function newBlockout(cells){ return {id:pid(),reason:"",years:ctx.kind==="year"?[scopeYear]:[],students:ctx.kind==="student"?[ctx.student.id]:[],teacher:isTeacher,cells:cells.slice()}; }
  function onCell(k,bo){
    if(bo){
      if(inherited(bo)){ selectedId=bo.id; draw(); return; }
      if(bo.id===selectedId){ bo.cells=bo.cells.filter(c=>c!==k); if(!bo.cells.length){S.blockouts=S.blockouts.filter(x=>x.id!==bo.id);selectedId=null;} save();draw();renderRight(); return; }
      selectedId=bo.id; draw(); return;
    }
    const sel=S.blockouts.find(x=>x.id===selectedId);
    if(sel&&applies(sel)&&!inherited(sel)){ sel.cells.push(k); save();draw();renderRight(); return; }
    const nb=newBlockout([k]); S.blockouts.push(nb); selectedId=nb.id; save();draw();renderRight();
  }
  function blockWholeDay(day){
    const dayCells=S.periods.map(p=>cellKey(day,p.id));
    const covering=S.blockouts.find(b=>applies(b)&&!inherited(b)&&dayCells.every(k=>(b.cells||[]).includes(k)));
    if(covering){ covering.cells=covering.cells.filter(c=>!dayCells.includes(c)); if(!covering.cells.length)S.blockouts=S.blockouts.filter(x=>x.id!==covering.id); selectedId=null; save();draw();renderRight(); return; }
    const nb=newBlockout(dayCells); S.blockouts.push(nb); selectedId=nb.id; save();draw();renderRight();
  }
  function renderCal(){
    const {cal,dayCols,ds}=calShell();
    const heads=cal.querySelectorAll(".calhead .calh");
    S.days.forEach((day,i)=>{const h=heads[i+1];if(h){h.classList.add("dayhead");h.title="Click to block or clear the whole day";h.onclick=()=>blockWholeDay(day)}});
    S.days.forEach(day=>S.periods.forEach(p=>{
      const k=cellKey(day,p.id);const b=bandEl(p,ds);b.classList.add("rslot");
      const tb=teacherAt(k);const bo=boAt(k);let label=esc(p.name);
      if(bo){
        b.classList.add(inherited(bo)?"rx-inherit":(isTeacher?"rx-teacher":((bo.students||[]).includes(ctx.student?ctx.student.id:"__none")&&ctx.kind==="student"?"rx-student":"rx-year")));
        if(bo.id===selectedId)b.classList.add("rx-sel");
        if(bo.reason)label=esc(bo.reason);
        b.onclick=()=>onCell(k,bo);
      }else if(tb){
        b.classList.add("rx-unavail");label=tb.reason?esc(tb.reason):"Unavailable";
        b.onclick=()=>toast("You're unavailable then — change it in “My unavailable times”.");
      }else{
        b.onclick=()=>onCell(k,null);
      }
      b.innerHTML=`<div class="bn">${label}</div>`;
      dayCols[day].append(b);
    }));
    return cal;
  }
  function renderEditor(){
    const b=S.blockouts.find(x=>x.id===selectedId);
    const ed=document.createElement("div");ed.className="boedit";
    if(!b){selectedId=null;return ed;}
    const inh=inherited(b);
    const top=document.createElement("div");top.className="row";top.style.justifyContent="space-between";
    top.innerHTML=`<strong>${isTeacher?"Unavailable time":"Blockout"}</strong>`;const x=document.createElement("button");x.className="ghost";x.textContent="Close";x.onclick=()=>{selectedId=null;draw()};top.append(x);ed.append(top);
    const rl=document.createElement("label");rl.textContent="Reason";rl.style.display="block";rl.style.marginTop="6px";
    const ri=document.createElement("input");ri.value=b.reason||"";ri.placeholder=isTeacher?"e.g. Staff meeting":"e.g. Whole-school assembly";ri.disabled=inh;
    ri.addEventListener("input",()=>{b.reason=ri.value;save()});ri.addEventListener("blur",()=>{renderRight();draw()});
    ed.append(rl,ri);
    if(inh){
      const note=document.createElement("div");note.className="hint";note.style.marginTop="8px";note.textContent="Year-level block (Year "+(b.years||[]).slice().sort(sortYears).join(", ")+"). Edit it from the year heading.";ed.append(note);
    }else if(isTeacher){
      const note=document.createElement("div");note.className="hint";note.style.marginTop="8px";note.textContent="No one can be scheduled during this time — it applies to every student.";ed.append(note);
      const del=document.createElement("button");del.className="danger";del.style.marginTop="8px";del.textContent="Delete";del.onclick=()=>{S.blockouts=S.blockouts.filter(x=>x.id!==b.id);selectedId=null;save();draw();renderRight()};ed.append(del);
    }else{
      const yl=document.createElement("div");yl.className="hint";yl.style.margin="8px 0 4px";yl.textContent="Applies to year levels:";
      const yr=document.createElement("div");yr.className="row";yr.style.flexWrap="wrap";
      years.forEach(y=>{const lab=document.createElement("label");lab.style.cssText="display:flex;gap:4px;align-items:center;font-size:12px";const cb=document.createElement("input");cb.type="checkbox";cb.style.width="auto";cb.checked=(b.years||[]).includes(y);cb.onchange=()=>{b.years=b.years||[];if(cb.checked){if(!b.years.includes(y))b.years.push(y)}else b.years=b.years.filter(v=>v!==y);save();draw();renderRight()};lab.append(cb,document.createTextNode("Yr "+y));yr.append(lab)});
      ed.append(yl,yr);
      const parts=[];if((b.years||[]).length)parts.push("Years "+b.years.slice().sort(sortYears).join(", "));if((b.students||[]).length)parts.push(b.students.length+" student"+(b.students.length>1?"s":""));
      const sum=document.createElement("div");sum.className="hint";sum.style.marginTop="6px";sum.textContent="Applies to: "+(parts.join(" · ")||"nobody yet");ed.append(sum);
      const del=document.createElement("button");del.className="danger";del.style.marginTop="8px";del.textContent="Delete blockout";del.onclick=()=>{S.blockouts=S.blockouts.filter(x=>x.id!==b.id);selectedId=null;save();draw();renderRight()};ed.append(del);
    }
    return ed;
  }
  function draw(){
    host.innerHTML="";
    if(selectedId)host.append(renderEditor());
    const wrap=document.createElement("div");wrap.className="rcalwrap";wrap.append(renderCal());host.append(wrap);
  }
  draw();
}

/* ===== RIGHT: time-based schedule ===== */
let dragPayload=null;
function payloadDuration(){if(!dragPayload)return 30;if(dragPayload.type==="new"){const s=studentById(dragPayload.studentId);return s?(s.duration||30):30}const pl=S.placements.find(p=>p.id===dragPayload.placementId);return pl?pl.duration:30}
function payloadStudents(){if(!dragPayload)return [];if(dragPayload.type==="new")return [dragPayload.studentId];const pl=S.placements.find(p=>p.id===dragPayload.placementId);return pl?[pl.studentId]:[]}

function blockedRangesForDay(day,studentIds){const out=[];S.blockouts.forEach(b=>{const applies=b.teacher||studentIds.some(id=>{const st=studentById(id);return (b.students||[]).includes(id)||(b.years||[]).includes(String(st?st.year:""))});if(!applies)return;(b.cells||[]).forEach(k=>{const c=parseCell(k);if(c.day===day){const p=periodById(c.periodId);if(p)out.push({s:toMin(p.start),e:toMin(p.end),reason:b.reason||""})}})});return out}
function overlapsBlocked(day,start,dur,studentIds){return blockedRangesForDay(day,studentIds).some(r=>start<r.e&&start+dur>r.s)}
function findSlot(day,desired,duration,studentIds,excludeId){
  const {ds,de}=dayBounds();const occ=[];
  S.placements.forEach(p=>{if(p.day===day&&p.id!==excludeId)occ.push({s:p.start,e:p.start+p.duration})});
  blockedRangesForDay(day,studentIds).forEach(r=>occ.push(r));
  let c=Math.round(desired/5)*5; if(c<ds)c=ds;
  let moved=true,guard=0;
  while(moved&&guard++<300){moved=false;occ.forEach(r=>{if(c<r.e&&c+duration>r.s){c=r.e;moved=true}})}
  if(c+duration>de)return null;
  return c;
}
function placementOnAt(day,t){return S.placements.find(p=>p.day===day&&t>=p.start&&t<p.start+p.duration)}

/* ===== rotation grouping (manual) + constraint helpers ===== */
const GROUP_COLORS=["#3f4ea3","#0f8a5f","#b45309","#8b2fb0","#0e7490","#a13d63","#556b2f","#9a3412","#1d4ed8","#047857"];
function groupIds(){return [...new Set(S.placements.map(p=>p.groupId).filter(Boolean))]}
function groupColor(gid){const i=groupIds().indexOf(gid);return GROUP_COLORS[(i<0?0:i)%GROUP_COLORS.length]}
function groupPlacements(gid){return S.placements.filter(p=>p.groupId===gid)}
function studentFreeAt(st,day,start){const dur=st.duration||30;const {ds,de}=dayBounds();if(start<ds||start+dur>de)return false;return !overlapsBlocked(day,start,dur,[st.id])}
function feasCount(st){const {ds,de}=dayBounds();const dur=st.duration||30;let n=0;S.days.forEach(day=>{for(let t=ds;t+dur<=de;t+=5)if(studentFreeAt(st,day,t))n++});return n}
function isScheduled(id){return S.placements.some(p=>p.studentId===id)}

let selected=new Set();
function toggleSelect(pid){if(selected.has(pid))selected.delete(pid);else selected.add(pid);updateSelBar();renderSchedule()}
function clearSelection(){selected.clear();updateSelBar();renderSchedule()}
function updateSelBar(){
  const bar=document.getElementById("selBar");if(!bar)return;
  const n=selected.size;bar.hidden=n===0;
  const sc=document.getElementById("selCount");if(sc)sc.textContent=n+" selected";
  const cb=document.getElementById("btnCombine");if(cb)cb.disabled=n<2;
  const gids=[...new Set([...selected].map(pid=>{const p=S.placements.find(x=>x.id===pid);return p?p.groupId:null}).filter(Boolean))];
  const ub=document.getElementById("btnUngroup");if(ub)ub.hidden=gids.length===0;
}
function combineSelected(){
  const ids=[...selected];if(ids.length<2)return;
  const gid=pid();S.placements.forEach(p=>{if(ids.includes(p.id))p.groupId=gid});
  selected.clear();save();updateSelBar();renderRight();
  const w=groupWarnings(gid);
  if(w.length)toast("Grouped — heads up: "+w.length+" clash"+(w.length>1?"es":"")+" (see the red marks).");
  else toast("Rotation group created.");
}
function ungroupSelected(){const ids=[...selected];S.placements.forEach(p=>{if(ids.includes(p.id))p.groupId=null});selected.clear();save();updateSelBar();renderRight()}
function groupWarnings(gid){
  const pls=groupPlacements(gid);const out=[];
  pls.forEach(p=>{const st=studentById(p.studentId);if(!st)return;pls.forEach(o=>{if(overlapsBlocked(o.day,o.start,o.duration,[st.id]))out.push({student:st,day:o.day,start:o.start})})});
  return out;
}
function placementHasWarning(pl){
  if(!pl.groupId)return false;const st=studentById(pl.studentId);if(!st)return false;
  return groupPlacements(pl.groupId).some(o=>overlapsBlocked(o.day,o.start,o.duration,[st.id]));
}

function renderRight(){renderSchedule();renderConflicts();renderStudents()}
function renderSchedule(){
  const host=document.getElementById("schedWrap");host.innerHTML="";
  if(!S.students.length){host.innerHTML=`<div class="empty">Add students, then drag them onto the calendar.</div>`;return}
  const {cal,dayCols,ds}=calShell();
  S.days.forEach(day=>{
    const col=dayCols[day];
    S.periods.forEach((p,i)=>{const z=document.createElement("div");z.className="pzone"+(i%2?" alt":"");z.style.top=((toMin(p.start)-ds)*PXPM)+"px";z.style.height=((toMin(p.end)-toMin(p.start))*PXPM)+"px";z.innerHTML=`<span class="pzn">${esc(p.name)}</span>`;col.append(z)});
    S.blockouts.filter(b=>b.teacher).forEach(b=>b.cells.forEach(k=>{const c=parseCell(k);if(c.day!==day)return;const p=periodById(c.periodId);if(!p)return;const z=document.createElement("div");z.className="unavailzone";z.style.top=((toMin(p.start)-ds)*PXPM)+"px";z.style.height=((toMin(p.end)-toMin(p.start))*PXPM)+"px";if(b.reason)z.title=b.reason;z.innerHTML=`<span class="uz">${b.reason?esc(b.reason):"Unavailable"}</span>`;col.append(z)}));
    S.placements.filter(p=>p.day===day).forEach(pl=>col.append(renderLessonBlock(pl,ds)));
    col.addEventListener("dragover",e=>onColDragover(e,day,col,ds));
    col.addEventListener("drop",e=>onColDrop(e,day,col,ds));
  });
  host.append(cal);
  if(dragPayload)paintBlocked();
}
function renderLessonBlock(pl,ds){
  const st=studentById(pl.studentId);
  const div=document.createElement("div");div.className="lesson"+(pl.groupId?" grouped":"")+(selected.has(pl.id)?" sel":"");
  div.style.top=((pl.start-ds)*PXPM)+"px";div.style.height=(pl.duration*PXPM)+"px";div.dataset.pid=pl.id;div.draggable=true;
  if(pl.groupId)div.style.setProperty("--gc",groupColor(pl.groupId));
  const timelbl=`${minToStr(pl.start)}–${minToStr(pl.start+pl.duration)}`;
  const warn=placementHasWarning(pl)?`<span class="warn" title="This student is blocked during another slot in this rotation">!</span>`:"";
  if(st)div.innerHTML=`<span class="who"><span class="dot" style="background:${yearColor(st.year)}"></span>${esc(st.name)}${warn}</span><span class="sub">${esc(st.instrument||"")} · ${timelbl}${pl.groupId?" · ⟳":""}</span>`;
  else div.innerHTML=`<span class="sub">${timelbl}</span>`;
  div.title="Click to edit · ⌘/Ctrl-click to select · drag to move";
  div.addEventListener("dragstart",e=>{dragPayload={type:"move",placementId:pl.id};e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",pl.id);e.stopPropagation();paintBlocked()});
  div.addEventListener("dragend",()=>{dragPayload=null;clearOverlays()});
  div.addEventListener("click",e=>{e.stopPropagation();if(e.metaKey||e.ctrlKey){toggleSelect(pl.id);return}if(st)openStudentDialog(st,pl)});
  return div;
}
function yToTime(col,clientY,ds){const r=col.getBoundingClientRect();return ds+(clientY-r.top)/PXPM}
function clearOverlays(){document.querySelectorAll(".blockzone,.preview").forEach(n=>n.remove());document.querySelectorAll(".lesson.mergeTarget").forEach(n=>n.classList.remove("mergeTarget"))}
function paintBlocked(){
  const {ds}=dayBounds();const sids=payloadStudents();
  document.querySelectorAll("#schedWrap .calday").forEach(col=>{
    const day=col.dataset.day;
    blockedRangesForDay(day,sids).forEach(r=>{const z=document.createElement("div");z.className="blockzone";z.style.top=((r.s-ds)*PXPM)+"px";z.style.height=((r.e-r.s)*PXPM)+"px";if(r.reason)z.title=r.reason;col.append(z)});
  });
}
function onColDragover(e,day,col,ds){
  if(!dragPayload)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  const dur=payloadDuration();const sids=payloadStudents();const excl=dragPayload.type==="move"?dragPayload.placementId:null;
  const desired=yToTime(col,e.clientY,ds);const snapped=Math.round(desired/5)*5;
  const slot=findSlot(day,desired,dur,sids,excl);
  const top=(slot==null?snapped:slot);
  showPreview(col,slot==null,((top-ds)*PXPM),(dur*PXPM),slot==null?"no room":minToStr(slot));
}
let _preview=null;
function showPreview(col,bad,top,height,label){
  if(!_preview){_preview=document.createElement("div");}
  _preview.className="preview"+(bad?" bad":"");
  _preview.style.top=top+"px";_preview.style.height=height+"px";
  _preview.innerHTML=`<span class="pl">${label}</span>`;
  if(_preview.parentNode!==col)col.append(_preview);
}
function hidePreview(){if(_preview&&_preview.parentNode)_preview.parentNode.removeChild(_preview);}
function onColDrop(e,day,col,ds){
  e.preventDefault();if(!dragPayload){clearOverlays();return}
  const desired=yToTime(col,e.clientY,ds);
  if(dragPayload.type==="new"){
    const s=studentById(dragPayload.studentId);if(!s){clearOverlays();return}const dur=s.duration||30;
    const slot=findSlot(day,desired,dur,[s.id]);
    if(slot==null){toast("No free time there.");clearOverlays();return}
    S.placements.push({id:pid(),day,start:slot,duration:dur,studentId:s.id,groupId:null});save();renderRight();
  }else{
    const pl=S.placements.find(x=>x.id===dragPayload.placementId);if(!pl){clearOverlays();return}
    const slot=findSlot(day,desired,pl.duration,[pl.studentId],pl.id);
    if(slot==null){toast("No room there.");clearOverlays();return}
    pl.day=day;pl.start=slot;save();renderRight();
  }
  clearOverlays();
}
function renderConflicts(){const msgs=[];const seen={};S.placements.forEach(p=>{seen[p.studentId]=(seen[p.studentId]||0)+1});const dbl=Object.entries(seen).filter(([,n])=>n>1).map(([id])=>studentById(id)?.name).filter(Boolean);if(dbl.length)msgs.push(dbl.length+" placed twice: "+dbl.join(", "));const warned=new Set();groupIds().forEach(gid=>groupWarnings(gid).forEach(w=>warned.add(w.student.name)));if(warned.size)msgs.push(warned.size+" rotation clash"+(warned.size>1?"es":"")+": "+[...warned].join(", "));document.getElementById("conflictMsg").textContent=msgs.join(" · ")}
document.getElementById("btnClearPlace").onclick=()=>{if(!S.placements.length)return;if(confirm("Clear all placed lessons?")){S.placements=[];selected.clear();save();renderRight()}};
document.getElementById("btnTeacher").onclick=openTeacherDialog;
document.getElementById("btnCombine").onclick=combineSelected;
document.getElementById("btnUngroup").onclick=ungroupSelected;
document.getElementById("btnSelClear").onclick=clearSelection;

/* ===== boot ===== */
function renderAll(){renderStudents();renderSchedule();renderConflicts()}
boot();
</script>
